version: 2
updates:
  # gwt ships prebuilt binaries, so a dependency left behind is shipped to
  # everyone who installs it.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine bumps; anything breaking still
      # arrives on its own so it gets read.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
