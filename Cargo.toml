[package]
name = "gwx"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "A friendly git worktree manager with automatic paths, hooks and shell integration"
license = "MIT"
repository = "https://github.com/ktakada42/gwx"
readme = "README.md"
keywords = ["git", "worktree", "cli", "development"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gwx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "unstable-ext"] }
# Dynamic completion (worktree and branch names) lives behind an unstable
# feature, so the version range is pinned to the minor it was written against.
clap_complete = { version = "~4.6", features = ["unstable-dynamic"] }
clap_mangen = "0.3"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
