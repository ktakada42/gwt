[package]
name = "gwt"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A friendly git worktree manager with automatic paths, hooks and shell integration"
license = "MIT"
repository = "https://github.com/ktakada42/gwt"
readme = "README.md"
keywords = ["git", "worktree", "cli", "development"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
